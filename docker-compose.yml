services:
  web:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
    container_name: cbt_nova_web
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      TZ: Asia/Jakarta

  db:
    image: mysql:8.0
    container_name: cbt_nova_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: cbt_nova
      MYSQL_USER: cbt_user
      MYSQL_PASSWORD: cbt_pass
      TZ: Asia/Jakarta
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database_backup.sql:/docker-entrypoint-initdb.d/database_backup.sql:ro

volumes:
  db_data:
